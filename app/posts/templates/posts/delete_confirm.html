{% extends "base.html" %}

{% block title %}Confirm Deletion{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="content-card text-center">
            <h2>Confirm Deletion</h2>
            <hr>
            <p class="lead">Are you sure you want to delete this post?</p>
            <h4>"{{ post.title }}"</h4>

            <form method="POST" class="mt-4">
                {{ form.hidden_tag() }}

                <button type="submit" class="btn btn-danger">Yes, Delete This Post</button>
                <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
